name: LMS CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lms_test
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lms -d lms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      SECRET_KEY: ci-only-django-key-not-used-on-the-server-123456789
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      POSTGRES_DB: lms_test
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: ci-only-password
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_SUCCESS_URL: http://localhost/api/payments/success/
      STRIPE_CANCEL_URL: http://localhost/api/payments/cancel/
      DEFAULT_FROM_EMAIL: ci@example.com
      TIME_ZONE: UTC

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Poetry and dependencies
        run: |
          python -m pip install "poetry==2.2.1"
          poetry install --with dev --no-root --no-interaction

      - name: Check Django configuration
        run: poetry run python manage.py check

      - name: Check migrations
        run: poetry run python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: poetry run python manage.py test --noinput

  lint:
    name: Lint
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Poetry and dependencies
        run: |
          python -m pip install "poetry==2.2.1"
          poetry install --with dev --no-root --no-interaction

      - name: Run Ruff
        run: poetry run ruff check .

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build application image
        run: docker build --tag lms-service:ci .