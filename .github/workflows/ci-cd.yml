name: LMS CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lms_test
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lms -d lms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      SECRET_KEY: ci-only-django-key-not-used-on-the-server-123456789
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      POSTGRES_DB: lms_test
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: ci-only-password
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_SUCCESS_URL: http://localhost/api/payments/success/
      STRIPE_CANCEL_URL: http://localhost/api/payments/cancel/
      DEFAULT_FROM_EMAIL: ci@example.com
      TIME_ZONE: UTC

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Poetry and dependencies
        run: |
          python -m pip install "poetry==2.2.1"
          poetry install --with dev --no-root --no-interaction

      - name: Check Django configuration
        run: poetry run python manage.py check

      - name: Check migrations
        run: poetry run python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: poetry run python manage.py test --noinput

  lint:
    name: Lint
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Poetry and dependencies
        run: |
          python -m pip install "poetry==2.2.1"
          poetry install --with dev --no-root --no-interaction

      - name: Run Ruff
        run: poetry run ruff check .

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build application image
        run: docker build --tag "lms-service:${GITHUB_SHA}" .

      - name: Save image for deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker save "lms-service:${GITHUB_SHA}" | gzip > lms-image.tar.gz

      - name: Upload application image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: lms-image
          path: lms-image.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  deploy:
    name: Deploy
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    concurrency:
      group: lms-production
      cancel-in-progress: false

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download application image
        uses: actions/download-artifact@v4
        with:
          name: lms-image
          path: artifacts

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/home/[a-zA-Z0-9_-]+/[a-zA-Z0-9_-]+$ ]]

          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lms_actions
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/lms_actions ~/.ssh/known_hosts

      - name: Transfer image
        run: |
          scp \
            -P "$SSH_PORT" \
            -i ~/.ssh/lms_actions \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            artifacts/lms-image.tar.gz \
            "${SSH_USER}@${SSH_HOST}:/tmp/lms-${GITHUB_SHA}.tar.gz"

      - name: Deploy on server
        run: |
          ssh \
            -p "$SSH_PORT" \
            -i ~/.ssh/lms_actions \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "${SSH_USER}@${SSH_HOST}" \
            "bash -s -- '$DEPLOY_PATH' '$GITHUB_SHA'" \
            < scripts/deploy.sh

      - name: Remove runner SSH key
        if: always()
        run: rm -f ~/.ssh/lms_actions