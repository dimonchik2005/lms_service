openapi: 3.0.3
info:
  title: LMS Service API
  version: 1.0.0
  description: API для управления курсами, уроками, пользователями, платежами и подписками.
paths:
  /api/courses/:
    get:
      operationId: courses_list
      description: CRUD для курсов с разграничением доступа.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - courses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCourseList'
          description: ''
    post:
      operationId: courses_create
      description: CRUD для курсов с разграничением доступа.
      tags:
      - courses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CourseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CourseRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
          description: ''
  /api/courses/{id}/:
    get:
      operationId: courses_retrieve
      description: CRUD для курсов с разграничением доступа.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Курс.
        required: true
      tags:
      - courses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
          description: ''
    put:
      operationId: courses_update
      description: CRUD для курсов с разграничением доступа.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Курс.
        required: true
      tags:
      - courses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CourseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CourseRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
          description: ''
    patch:
      operationId: courses_partial_update
      description: CRUD для курсов с разграничением доступа.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Курс.
        required: true
      tags:
      - courses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCourseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCourseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCourseRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
          description: ''
    delete:
      operationId: courses_destroy
      description: CRUD для курсов с разграничением доступа.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Курс.
        required: true
      tags:
      - courses
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/lessons/:
    get:
      operationId: lessons_list
      description: Список и создание уроков.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - lessons
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLessonList'
          description: ''
    post:
      operationId: lessons_create
      description: Список и создание уроков.
      tags:
      - lessons
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LessonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LessonRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
          description: ''
  /api/lessons/{id}/:
    get:
      operationId: lessons_retrieve
      description: Просмотр, изменение и удаление урока.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - lessons
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
          description: ''
    put:
      operationId: lessons_update
      description: Просмотр, изменение и удаление урока.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - lessons
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LessonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LessonRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
          description: ''
    patch:
      operationId: lessons_partial_update
      description: Просмотр, изменение и удаление урока.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - lessons
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedLessonRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedLessonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedLessonRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
          description: ''
    delete:
      operationId: lessons_destroy
      description: Просмотр, изменение и удаление урока.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - lessons
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/subscriptions/toggle/:
    post:
      operationId: subscriptions_toggle_create
      description: Если подписки пользователя на курс нет, она создаётся. Если подписка
        уже существует, она удаляется.
      summary: Добавить или удалить подписку
      tags:
      - subscriptions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionToggleRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SubscriptionToggleRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubscriptionToggleRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionToggleResponse'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionToggleResponse'
          description: ''
        '400':
          description: Не указан или некорректен ID курса.
        '401':
          description: Пользователь не авторизован.
        '404':
          description: =Курс не найден.
  /api/token/:
    post:
      operationId: token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/token/refresh/:
    post:
      operationId: token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/users/:
    get:
      operationId: users_list
      description: Выводит общедоступные профили.
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicUser'
          description: ''
  /api/users/{id}/:
    get:
      operationId: users_retrieve
      description: Просматривает профиль и управляет своим профилем.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: users_update
      description: Просматривает профиль и управляет своим профилем.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: users_partial_update
      description: Просматривает профиль и управляет своим профилем.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    delete:
      operationId: users_destroy
      description: Просматривает профиль и управляет своим профилем.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/users/payments/:
    get:
      operationId: users_payments_list
      description: Выводит платежи текущего пользователя.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'
          description: ''
  /api/users/payments/{id}/status/:
    get:
      operationId: users_payments_status_retrieve
      description: Проверяет платёжную сессию Stripe и синхронизирует статус локального
        платежа.
      summary: Проверить статус Stripe-платежа
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
        '401':
          description: Пользователь не авторизован.
        '404':
          description: Платёж не найден.
        '502':
          description: Ошибка обращения к Stripe.
  /api/users/payments/checkout/:
    post:
      operationId: users_payments_checkout_create
      description: Создаёт продукт, цену и платёжную сессию Stripe. Возвращает данные
        платежа и ссылку.
      summary: Создание оплаты курса через Stripe
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StripePaymentCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StripePaymentCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StripePaymentCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
        '400':
          description: Некорректные данные.
        '401':
          description: Пользователь не авторизован.
        '502':
          description: Ошибка обращения к Stripe.
  /api/users/register/:
    post:
      operationId: users_register_create
      description: Регистрирует пользователя без JWT.
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegistration'
          description: ''
components:
  schemas:
    Course:
      type: object
      description: Сериализатор курса.
      properties:
        id:
          type: integer
          readOnly: true
        owner:
          type: integer
          readOnly: true
          nullable: true
          title: Владелец
        title:
          type: string
          title: Название
          maxLength: 255
        preview:
          type: string
          format: uri
          nullable: true
          title: Превью
        description:
          type: string
          title: Описание
        lesson_count:
          type: string
          readOnly: true
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/Lesson'
          readOnly: true
        is_subscribed:
          type: boolean
          readOnly: true
      required:
      - id
      - is_subscribed
      - lesson_count
      - lessons
      - owner
      - title
    CourseRequest:
      type: object
      description: Сериализатор курса.
      properties:
        title:
          type: string
          minLength: 1
          title: Название
          maxLength: 255
        preview:
          type: string
          format: binary
          nullable: true
          title: Превью
        description:
          type: string
          title: Описание
      required:
      - title
    Lesson:
      type: object
      description: Сериализатор урока.
      properties:
        id:
          type: integer
          readOnly: true
        owner:
          type: integer
          readOnly: true
          nullable: true
          title: Владелец
        course:
          type: integer
          title: Курс
        title:
          type: string
          title: Название
          maxLength: 255
        description:
          type: string
          title: Описание
        preview:
          type: string
          format: uri
          nullable: true
          title: Превью
        video_url:
          type: string
          format: uri
      required:
      - course
      - id
      - owner
      - title
      - video_url
    LessonRequest:
      type: object
      description: Сериализатор урока.
      properties:
        course:
          type: integer
          title: Курс
        title:
          type: string
          minLength: 1
          title: Название
          maxLength: 255
        description:
          type: string
          title: Описание
        preview:
          type: string
          format: binary
          nullable: true
          title: Превью
        video_url:
          type: string
          format: uri
          minLength: 1
      required:
      - course
      - title
      - video_url
    PaginatedCourseList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Course'
    PaginatedLessonList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Lesson'
    PatchedCourseRequest:
      type: object
      description: Сериализатор курса.
      properties:
        title:
          type: string
          minLength: 1
          title: Название
          maxLength: 255
        preview:
          type: string
          format: binary
          nullable: true
          title: Превью
        description:
          type: string
          title: Описание
    PatchedLessonRequest:
      type: object
      description: Сериализатор урока.
      properties:
        course:
          type: integer
          title: Курс
        title:
          type: string
          minLength: 1
          title: Название
          maxLength: 255
        description:
          type: string
          title: Описание
        preview:
          type: string
          format: binary
          nullable: true
          title: Превью
        video_url:
          type: string
          format: uri
          minLength: 1
    PatchedUserRequest:
      type: object
      description: Сериализатор профиля пользователя.
      properties:
        phone:
          type: string
          title: Телефон
          maxLength: 35
        city:
          type: string
          title: Город
          maxLength: 150
        avatar:
          type: string
          format: binary
          nullable: true
          title: Аватар
    Payment:
      type: object
      description: Сериализатор платежа с вложенными данными.
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
          title: Пользователь
        user_email:
          type: string
          readOnly: true
        payment_date:
          type: string
          format: date-time
          readOnly: true
          title: Дата оплаты
        paid_course:
          allOf:
          - $ref: '#/components/schemas/Course'
          readOnly: true
        paid_lesson:
          allOf:
          - $ref: '#/components/schemas/Lesson'
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: Сумма оплаты
        payment_method:
          allOf:
          - $ref: '#/components/schemas/PaymentMethodEnum'
          title: Способ оплаты
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
          title: Статус платежа
        stripe_product_id:
          type: string
          readOnly: true
          nullable: true
          title: ID продукта Stripe
        stripe_price_id:
          type: string
          readOnly: true
          nullable: true
          title: ID цены Stripe
        stripe_session_id:
          type: string
          readOnly: true
          nullable: true
          title: ID сессии Stripe
        payment_link:
          type: string
          format: uri
          readOnly: true
          nullable: true
          title: Ссылка на оплату
      required:
      - amount
      - id
      - paid_course
      - paid_lesson
      - payment_date
      - payment_link
      - payment_method
      - status
      - stripe_price_id
      - stripe_product_id
      - stripe_session_id
      - user
      - user_email
    PaymentMethodEnum:
      enum:
      - cash
      - transfer
      - stripe
      type: string
      description: |-
        * `cash` - Наличные
        * `transfer` - Перевод на счёт
        * `stripe` - Stripe
    PaymentRequest:
      type: object
      description: Сериализатор платежа с вложенными данными.
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: Сумма оплаты
        payment_method:
          allOf:
          - $ref: '#/components/schemas/PaymentMethodEnum'
          title: Способ оплаты
      required:
      - amount
      - payment_method
    PublicUser:
      type: object
      description: Общедоступные данные пользователя.
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        phone:
          type: string
          readOnly: true
          title: Телефон
        city:
          type: string
          readOnly: true
          title: Город
        avatar:
          type: string
          format: uri
          nullable: true
          readOnly: true
